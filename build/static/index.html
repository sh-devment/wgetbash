<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wgetbash</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ════ LOGIN ════ -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <div class="login-center">
    <div class="login-card">
      <div class="login-logo">WGETBASH</div>
      <div class="login-sub"><a href="https://sh-development.{{.Zone}}" target="_blank">sh-development.{{.Zone}}</a></div>
      <button class="login-btn" id="doLogin">{{.LoginButton}}</button>
    </div>
    <div class="login-panel open" id="loginPanel">
      <div class="login-panel-inner">
        <div class="login-hello">{{.LoginHello}}</div>
        <div class="login-panel-foot">
          <span class="login-foot-dot"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ════ APP ════ -->
<div class="app-wrap" id="appWrap">

  <!-- Header -->
  <nav class="navbar">
    <div class="nav-tabs">
      <button class="tab active" data-tab="wgetbash">wgetbash</button>
      <button class="tab" data-tab="loger">loger</button>
    </div>
    <div class="profile-area">
      <button class="profile-btn" id="userTrig" title="menu">
        <span id="userInitial">U</span>
      </button>
      <div class="profile-popover" id="userDrop">
        <div class="pi-info">
          <span class="pi-label" id="userProvider"></span>
          <span class="pi-name" id="userName"></span>
          <span class="pi-sub" id="userUid"></span>
        </div>
        <div class="pi-list">
          <a class="pi-action" href="/auth/delegate">apps</a>
          <a class="pi-action" href="https://github.com/sh-devment/wgetbash/blob/main/README.md" target="_blank" rel="noopener">readme</a>
          <button class="pi-action pi-logout" id="logoutRow">log out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Views -->
  <div class="view active" data-view="wgetbash">
  <main class="main">
    <div class="app-box">

      <!-- Sidebar -->
      <div class="sb" id="sb">
        <div class="sb-hd">
          <input class="sb-search" id="sbSearch" placeholder="search" autocomplete="off"/>
        </div>
        <div class="grp-list" id="grpList"></div>
      </div>

      <!-- Right panel -->
      <div class="rp">
        <div class="rp-hd">
          <button class="ib sm" id="backBtn" style="display:none" title="back">
            <svg width="8" height="12" viewBox="0 0 8 12" fill="none">
              <path d="M6 2L2 6L6 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="rp-title" id="rpTitle">—</span>
          <div class="dd" id="grpMenuWrap" style="visibility:hidden">
            <button class="ib sm" id="grpTrig" title="group menu">
              <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
                <path d="M1 1.5H13M1 5H13M1 8.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="drop" id="grpDrop" style="display:none">
              <div class="drop-row" id="grpNameRow">
                <span class="drop-lbl" id="grpNameDisplay"></span>
                <button class="ib sm amber" id="grpRenameBtn" title="edit name">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path d="M7.5 1.5L9 3L3.5 9H1.5V7L7.5 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="drop-row" id="delGrpRow">
                <span class="drop-lbl">delete group</span>
                <button class="ib sm danger" title="delete">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="sc-list" id="scList"></div>
      </div>

    </div>
  </main>
  </div><!-- /view wgetbash -->

  <!-- ════ LOGER VIEW ════ -->
  <div class="view" data-view="loger" id="viewLoger">

    <!-- action bar (visible once logs are loaded) -->
    <div class="lgr-acts" id="lgrActs" style="display:none">
      <button class="lgr-btn" id="lgrLoadNewBtn">load new</button>
      <button class="lgr-btn danger" id="lgrClearBtn">clear</button>
      <button class="lgr-btn" id="lgrSelectBtn">select</button>
      <button class="lgr-btn" id="lgrNewWindowBtn">new window</button>
      <span class="lgr-count" id="lgrCount">0 / 0 lines</span>
    </div>

    <!-- load screen -->
    <div class="lgr-load" id="lgrLoad">
      <div class="lgr-drop" id="lgrDropZone">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.4;margin-bottom:10px">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="12" y2="12"/>
          <line x1="15" y1="15" x2="12" y2="12"/>
        </svg>
        <p><strong>Drop a log file here</strong><br>or click to browse</p>
        <div class="lgr-fmts">
          <span class="lgr-fmt">.log</span><span class="lgr-fmt">.txt</span>
          <span class="lgr-fmt">.out</span><span class="lgr-fmt">.err</span>
          <span class="lgr-fmt">.json</span><span class="lgr-fmt">.jsonl</span>
          <span class="lgr-fmt">.csv</span>
        </div>
        <div class="lgr-drop-err" id="lgrDropErr"></div>
      </div>
      <div class="lgr-paste-wrap">
        <label>or paste log text</label>
        <textarea id="lgrPaste" placeholder="Paste log lines here…"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <button class="lgr-btn primary" id="lgrPasteLoad">load</button>
        </div>
      </div>
      <input type="file" id="lgrFile" accept=".log,.txt,.out,.err,.json,.jsonl,.ndjson,.csv" style="display:none">
    </div>

    <!-- workspace -->
    <div class="lgr-workspace" id="lgrWorkspace" style="display:none">

      <!-- focus + remove bar -->
      <div class="lgr-bar">
        <div class="lgr-col">
          <div class="lgr-col-hd">
            <span class="lgr-lbl focus">Focus</span>
            <span class="lgr-hint">center line context</span>
          </div>
          <div class="lgr-focus-row">
            <div class="lgr-field"><label>center</label><input type="number" id="lgrFocusCenter" value="0" min="0"></div>
            <span class="lgr-sep">±</span>
            <div class="lgr-field"><label>before</label><input type="number" id="lgrFocusBefore" value="0" min="0"></div>
            <div class="lgr-field"><label>after</label><input type="number" id="lgrFocusAfter" value="0" min="0"></div>
            <div class="lgr-focus-acts">
              <button class="lgr-pill-btn active" id="lgrFocusToggle">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                on
              </button>
              <button class="lgr-pill-btn del" id="lgrFocusReset">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                reset
              </button>
            </div>
          </div>
        </div>
        <div class="lgr-sep-v"></div>
        <div class="lgr-col">
          <div class="lgr-col-hd">
            <span class="lgr-lbl remove">Remove</span>
            <span class="lgr-hint">hide matching</span>
          </div>
          <div class="lgr-cond-list" id="lgrRemoveList"></div>
          <button class="lgr-add-btn remove" id="lgrAddRemove">+ add</button>
        </div>
      </div>

      <!-- grep + math bar -->
      <div class="lgr-bar">
        <div class="lgr-col">
          <div class="lgr-col-hd">
            <span class="lgr-lbl grep">Grep</span>
            <span class="lgr-hint">show only matching</span>
          </div>
          <div class="lgr-cond-list" id="lgrGrepList"></div>
          <button class="lgr-add-btn grep" id="lgrAddGrep">+ add</button>
        </div>
        <div class="lgr-sep-v"></div>
        <div class="lgr-col">
          <div class="lgr-col-hd">
            <span class="lgr-lbl math">Math</span>
            <span class="lgr-hint">filter by number value</span>
          </div>
          <div class="lgr-cond-list" id="lgrMathList"></div>
          <button class="lgr-add-btn math" id="lgrAddMath">+ add</button>
        </div>
      </div>

      <!-- log output -->
      <div class="lgr-display" id="lgrDisplay"></div>

    </div><!-- /lgr-workspace -->
  </div><!-- /view loger -->

</div><!-- /app-wrap -->

<!-- Confirm modal -->
<div class="overlay" id="confirmOverlay" style="display:none">
  <div class="modal">
    <div class="modal-q">are u shure?</div>
    <div class="modal-btns">
      <button class="ib teal" id="confirmYes">
        <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
          <path d="M1.5 6L5 9.5L12.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="ib danger" id="confirmNo">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="markdown.js"></script>
<script src="script.js"></script>
</body>
</html>
